name: Windows EXE erstellen
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Einzelne Windows-EXE kompilieren
        run: dotnet publish EBVScan.Windows/EBVScan.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: EBV-Scan-Windows-1.5.2
          path: publish/EBV Scan.exe
          if-no-files-found: error
      - name: ZIP-Datei für den Browser erstellen
        shell: pwsh
        run: Compress-Archive -LiteralPath "publish/EBV Scan.exe" -DestinationPath "publish/EBV-Scan-Windows-1.5.2.zip" -Force
      - name: Öffentlichen Download veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.2
          name: EBV Scan Windows 1.5.2
          body: Selbständige 64-Bit-Windows-Version mit PDF-OCR und EBV-Auswertung. Keine zusätzliche .NET-Installation erforderlich.
          files: |
            publish/EBV Scan.exe
            publish/EBV-Scan-Windows-1.5.2.zip
